name: Scraper Banques
on:
  schedule:
    - cron: '*/5 * * * *' # Se lance toutes les 5 minutes
  workflow_dispatch: # Permet de le lancer manuellement avec un bouton

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorise GitHub à sauvegarder le fichier JSON

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer Tor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor
          sudo service tor start
          sleep 5
          # Vérifier que Tor est bien démarré sur le port 9050
          if curl --socks5 127.0.0.1:9050 --connect-timeout 15 https://check.torproject.org/api/ip 2>/dev/null | grep -q '"IsTor":true'; then
            echo "✅ Tor est fonctionnel"
          else
            echo "⚠️ Tor n'a pas pu se connecter, on continue sans"
          fi

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Lancer le scraper
        env:
          DISCORD_WEBHOOK_OFFERS: ${{ secrets.DISCORD_WEBHOOK_OFFERS }}
          DISCORD_WEBHOOK_REPORTS: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
          TOR_PROXY: "socks5://127.0.0.1:9050"
        run: python main.py

      - name: Sauvegarder les nouvelles offres dans le JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Bot : Mise à jour des offres existantes"
